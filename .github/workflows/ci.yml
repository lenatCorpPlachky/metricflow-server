name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --extra duckdb

      - name: Run tests
        run: uv run --extra duckdb pytest tests/ -v
        env:
          MF_API_KEY: test-api-key
          MF_ADMIN_KEY: test-admin-key
